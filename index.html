<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>عيد ميلاد رحمة الـ 17 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Marhey:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#FFFDF9;color:#2C2C2C}
body{font-family:'Cairo',sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit}
#app{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:8px 8px;position:relative;overflow-x:hidden;user-select:none}
.font-marhey{font-family:'Marhey',cursive,sans-serif}
.font-cairo{font-family:'Cairo',sans-serif}
.header{position:fixed;top:0;left:0;right:0;z-index:40;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;max-width:576px;margin:auto}
.audio-btn,.progress{pointer-events:auto;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border:2px solid #2C2C2C;box-shadow:2px 3px 0 #2C2C2C}
.audio-btn{position:fixed;top:16px;left:16px;z-index:50;padding:10px 12px;border-radius:9999px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer;color:#334155;transition:.15s}
.audio-btn:hover{transform:scale(1.05)} .audio-btn:active{transform:scale(.95)}
.progress{padding:6px 14px;border-radius:9999px;font-family:'Marhey';font-weight:700;font-size:12px;color:#db2777;display:flex;gap:6px;align-items:center}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 0 24px;z-index:10;width:100%;max-width:448px;margin:auto}
footer{text-align:center;font-size:12px;font-family:'Marhey';color:#94a3b8;padding:8px;position:relative;z-index:10}
.scene{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:82vh;padding:16px;text-align:center;position:relative;z-index:10;max-width:448px;margin:auto;animation:sceneIn .4s ease both}
.scene.wide{max-width:512px;min-height:85vh}
@keyframes sceneIn{from{opacity:0;transform:translateY(15px) scale(.98)}to{opacity:1;transform:none}}
.character{width:224px;height:224px;display:flex;align-items:center;justify-content:center;animation:charIn .55s cubic-bezier(.175,.885,.32,1.275) both;filter:drop-shadow(0 4px 4px rgba(0,0,0,.12))}
.character svg{width:100%;height:100%;overflow:visible}
@keyframes charIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.doodle-card{background:rgba(255,255,255,.95);border:3.5px solid #2C2C2C;border-radius:24px;box-shadow:4px 6px 0 #2C2C2C;width:100%;padding:24px;margin-bottom:24px;backdrop-filter:blur(8px)}
.doodle-card h1,.doodle-card h2,.doodle-card p{margin-top:0}
.doodle-btn{border:3.5px solid #2C2C2C;border-radius:9999px;box-shadow:3px 5px 0 #2C2C2C;transition:all .15s cubic-bezier(.175,.885,.32,1.275);cursor:pointer;font-family:'Marhey';font-weight:700}
.doodle-btn:active{transform:translateY(3px) translateX(2px);box-shadow:1px 2px 0 #2C2C2C}
.btn{padding:14px 32px;font-size:18px;width:100%;max-width:320px}
.pink{background:#FF85A1;color:#fff}.pink:hover{background:#FF6B8B}
.yellow{background:#FFF3B0;color:#1f2937}.yellow:hover{background:#FFE875}
.green{background:#C7F9CC;color:#1f2937}.green:hover{background:#A1F0AD}
.text-pink{color:#db2777}.text-teal{color:#0f766e}.text-purple{color:#6b21a8}
.small{font-size:16px}.medium{font-size:18px}.large{font-size:24px}.xl{font-size:30px}
.bold{font-weight:700}.extrabold{font-weight:800}
.leading{line-height:1.7}
.space>*+*{margin-top:12px}
.hidden{display:none!important}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-bottom:16px}
.choice{padding:12px 8px;font-size:15px}
.pink-light{background:#fce7f3;color:#9d174d}.purple-light{background:#f3e8ff;color:#6b21a8}.amber-light{background:#fef3c7;color:#92400e}
.selected-pink{background:#FF85A1;color:white;transform:scale(1.05)}
.selected-purple{background:#E2D4F9;color:#581c87;transform:scale(1.05)}
.selected-amber{background:#FFF3B0;color:#0f172a;transform:scale(1.05)}
.bubble{margin-top:12px;padding:10px;background:#fdf2f8;border:2px solid #f9a8d4;border-radius:12px;font-family:'Marhey';font-weight:700;color:#be185d;font-size:18px}
.advice-list{display:grid;gap:8px;text-align:right;font-weight:700;color:#334155;background:rgba(254,243,199,.6);padding:14px;border-radius:12px;border:1px solid #fde68a}
.advice-item{display:flex;align-items:center;gap:8px;font-size:17px;animation:slideIn .45s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(48px);animation:pulseGlow 3s ease-in-out infinite}
.orb1{width:288px;height:288px;top:-96px;left:-96px;background:rgba(251,207,232,.40)}
.orb2{width:320px;height:320px;top:33%;right:-96px;background:rgba(216,180,254,.18);animation-delay:1.5s}
.orb3{width:320px;height:320px;bottom:-80px;left:25%;background:rgba(253,230,138,.28);animation-delay:3s}
@keyframes pulseGlow{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.float{position:absolute;font-size:24px;opacity:.7;filter:drop-shadow(0 2px 2px rgba(0,0,0,.1));animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-12px) rotate(-6deg) scale(var(--s))}50%{transform:translateY(12px) rotate(6deg) scale(calc(var(--s)*1.15))}}
.animate-bounce{animation:bounce 1s infinite}.animate-pulse{animation:pulse 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(-5%)}50%{transform:none}}
@keyframes pulse{50%{opacity:.65}}
.animate-flame{animation:candleFlicker .6s ease-in-out infinite;transform-origin:bottom center}
@keyframes candleFlicker{0%,100%{transform:scale(1) rotate(-1deg);opacity:.95}25%{transform:scale(1.15,.9) rotate(2deg);opacity:1}50%{transform:scale(.9,1.1) rotate(-2deg);opacity:.85}75%{transform:scale(1.05) rotate(1deg);opacity:.98}}
.replay-lines p{margin:0 0 3px}
.final-title{font-size:28px;font-family:'Marhey';font-weight:800;color:#FF85A1;line-height:1.25;letter-spacing:.5px}
.final-sub{font-size:19px;font-family:'Marhey';font-weight:700;color:#6b21a8;margin-top:4px}
.final-card{text-align:right;padding:24px 24px 20px}
.final-card p{font-size:16px;line-height:1.8;font-weight:700;margin:0 0 3px}
.final-card .closing{color:#db2777;font-family:'Marhey';font-weight:800;font-size:19px;text-align:center;padding-top:8px}
.closing-note{margin-top:24px;padding-top:16px;border-top:2px dashed #fbcfe8;text-align:center;color:#db2777;font-family:'Marhey';font-weight:700;font-size:17px;line-height:1.7}
.cake-badge{position:absolute;top:-8px;right:-8px;background:#fce7f3;border:2px solid #2C2C2C;color:#db2777;padding:4px 12px;border-radius:9999px;font-family:'Marhey';font-weight:700;font-size:14px;box-shadow:2px 2px 0 #2C2C2C}
@media(max-width:480px){.character{width:224px;height:224px}.doodle-card{padding:20px}.xl{font-size:25px}.final-title{font-size:24px}.final-sub{font-size:17px}.audio-btn{left:12px;top:12px}.progress{font-size:11px;padding:6px 10px}.choice{font-size:13px}}
@media(min-width:640px){.character{width:256px;height:256px}.final-title{font-size:36px}.final-sub{font-size:24px}.small{font-size:18px}.medium{font-size:20px}}
</style>
</head>
<body>
<div id="bg">
  <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
  <div class="float" style="left:8%;top:12%;--s:1.1;animation-duration:6s;animation-delay:0s">💖</div>
  <div class="float" style="left:85%;top:15%;--s:.9;animation-duration:5s;animation-delay:1s">✨</div>
  <div class="float" style="left:15%;top:75%;--s:1.2;animation-duration:7s;animation-delay:2s">🌸</div>
  <div class="float" style="left:88%;top:80%;--s:.8;animation-duration:4.5s;animation-delay:.5s">⭐</div>
  <div class="float" style="left:5%;top:45%;--s:1;animation-duration:6.5s;animation-delay:1.5s">🎀</div>
  <div class="float" style="left:92%;top:48%;--s:.9;animation-duration:5.5s;animation-delay:2.5s">💖</div>
  <div class="float" style="left:48%;top:8%;--s:1.1;animation-duration:4s;animation-delay:1.2s">✨</div>
  <div class="float" style="left:80%;top:30%;--s:1;animation-duration:6.2s;animation-delay:.8s">🎈</div>
  <div class="float" style="left:20%;top:25%;--s:.85;animation-duration:5.8s;animation-delay:1.8s">💕</div>
</div>

<div id="app">
<header class="header">
  <button id="audioBtn" class="audio-btn" aria-label="كتم الصوت">🔊 <span id="audioText">موسيقى كيوت 🎵</span></button>
  <div class="progress"><span id="progressText">مرحلة 1 من 8</span><span>🎀</span></div>
</header>
<main id="main"></main>
<footer>صنع بحب لـ رحومتي 💖 21/8/2009</footer>
</div>

  const base = variant !== 'tangerine' ? `<g>
<path d="M 100 280 L 100 130 C 100 70, 200 70, 200 130 L 200 280" fill="#FFFFFF" stroke="#2C2C2C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  const body = VARIANTS[variant] || VARIANTS.gift;

}

const sound = (() => {
  let ctx=null, muted=false, bgm=false, timer=null;
  function init(){try{if(!ctx){const C=window.AudioContext||window.webkitAudioContext;ctx=new C()} if(ctx.state==='suspended')ctx.resume()}catch(e){}}
  function toggle(){muted=!muted;if(muted)stop();else start();return muted}
  function pop(){if(muted)return;try{init();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(800,t+.08);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.01,t+.08);o.connect(g);g.connect(ctx.destination);o.start();o.stop(t+.08)}catch(e){}}
  function chime(){if(muted)return;try{init();if(!ctx)return;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.06;o.type='triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.35)})}catch(e){}}
  function confettiSound(){if(muted)return;for(let i=0;i<5;i++)setTimeout(pop,i*40)}
  function start(){if(muted||bgm)return;try{init();if(!ctx)return;bgm=true;const melody=[[261.63,.3],[261.63,.3],[293.66,.6],[261.63,.6],[349.23,.6],[329.63,1],[261.63,.3],[261.63,.3],[293.66,.6],[261.63,.6],[392,.6],[349.23,1],[261.63,.3],[261.63,.3],[523.25,.6],[440,.6],[349.23,.6],[329.63,.6],[293.66,.8]];let step=0;const play=()=>{if(!bgm||!ctx||muted)return;const [f,d]=melody[step],o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+d*.9);o.connect(g);g.connect(ctx.destination);o.start();o.stop(t+d);step=(step+1)%melody.length;timer=setTimeout(play,d*1000+150)};play()}catch(e){}}
  function stop(){bgm=false;if(timer!==null){clearTimeout(timer);timer=null}}
  return {toggle,start,stop,pop,chime,confettiSound,getMuted:()=>muted};
})();
